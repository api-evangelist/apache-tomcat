aid: apache-tomcat
name: Apache Tomcat
description: >-
  Apache Tomcat is an open-source implementation of the Java Servlet, JavaServer Pages (JSP),
  Java Expression Language, and Java WebSocket technologies. It provides a pure Java HTTP web
  server and servlet container for hosting Java web applications. Tomcat exposes management APIs
  via the Manager application (HTTP text protocol), JMX for monitoring, and a Virtual Host Manager
  for configuration management. It is maintained by the Apache Software Foundation and is one of
  the most widely deployed Java application servers.
