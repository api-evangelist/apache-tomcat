apis:
- aid: apache-tomcat:apache-tomcat-manager-api
  name: Apache Tomcat Manager API
  description: >-
    The Tomcat Manager application provides an HTTP text protocol API for deploying, undeploying, starting,
    stopping, and reloading web applications remotely. Key endpoints include: /manager/text/list (list
    deployed apps), /manager/text/deploy (deploy a WAR file), /manager/text/undeploy, /manager/text/start,
    /manager/text/stop, /manager/text/reload, /manager/text/sessions (session statistics), and /manager/text/serverinfo.
    Requires manager-script role authentication.
  humanURL: https://tomcat.apache.org/tomcat-10.1-doc/manager-howto.html
  tags:
  - Administration
  - Deployment
  - Management
  - REST
  properties:
  - type: Documentation
    url: https://tomcat.apache.org/tomcat-10.1-doc/manager-howto.html
- aid: apache-tomcat:apache-tomcat-jmx-api
  name: Apache Tomcat JMX API
  description: >-
    The Tomcat JMX API exposes management and monitoring beans for Connectors, Engines, Hosts, Contexts,
    Sessions, DataSources, thread pools, and memory via Java Management Extensions. JMX can be accessed
    via JConsole, Java VisualVM, or remote JMX clients. Prometheus JMX Exporter can expose Tomcat metrics
    in Prometheus format via HTTP endpoint.
  humanURL: https://tomcat.apache.org/tomcat-10.1-doc/monitoring.html
  tags:
  - JMX
  - Monitoring
  - Management
  - Java
  properties:
  - type: Documentation
    url: https://tomcat.apache.org/tomcat-10.1-doc/monitoring.html
